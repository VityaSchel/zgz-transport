name: Publish (crates.io)
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: zgz-transport-crates-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ["publish", "hetzner"]
    timeout-minutes: 20

    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}

    env:
      WORKSPACE: /opt/zgz-transport-crates
      PACKAGE_DIR: lib/rust
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
      RUSTUP_VERSION: "1.29.0"
      RUSTUP_SHA256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
      RUST_VERSION: "1.95.0"

    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by build code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
          [ -z "$FORGEJO_SHA" ] || [ "$(git rev-parse HEAD)" = "$FORGEJO_SHA" ] \
            || { echo "FATAL: ref moved since the run was queued (want $FORGEJO_SHA, got $(git rev-parse HEAD))"; exit 1; }
          echo "publishing $FORGEJO_REF at $(git rev-parse HEAD)"

      - name: Install the pinned toolchain
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends gcc libc6-dev
          fi
          curl -fsSLo /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -q -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_VERSION" --component clippy,rustfmt
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/cargo" --version

      - name: Format
        run: cd "$WORKSPACE/$PACKAGE_DIR" && cargo fmt --check

      - name: Clippy
        run: cd "$WORKSPACE/$PACKAGE_DIR" && cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cd "$WORKSPACE/$PACKAGE_DIR" && cargo test --locked

      - name: Docs
        run: cd "$WORKSPACE/$PACKAGE_DIR" && RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Copy license
        run: cd "$WORKSPACE/$PACKAGE_DIR" && cp ../../LICENSE .

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?}"
          cd "$WORKSPACE/$PACKAGE_DIR"
          cargo publish --locked --allow-dirty
